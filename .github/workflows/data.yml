name: data

# Regenerate the data distributed with the article from the IRIS level-1
# archive, one campaign per job, and open a pull request with the result.
#
# A first job asks the catalog which frames each campaign covers and works
# out which campaigns need extracting: those whose frames or whose
# extraction code have changed since their cutouts were made. Each campaign
# then gets a job of its own, since the archive is gigabytes and a job may
# run for six hours at most; a campaign that is current is exported from the
# package instead of fetched. A final job joins the campaigns, refits every
# track, and opens the pull request. It runs even if a campaign's job
# failed, keeping that campaign's existing cutouts and saying so, so the
# next run redoes only what is missing.
#
# The images themselves are not cached: the cutouts are what is worth
# keeping, and they live in the repository.
#
# GitHub holds the checks of a pull request opened with the workflow's own
# token until someone approves them, so after opening the pull request the
# merge job approves them itself. It also never chains one workflow off a
# run that its own token caused, so the `tests` run for such a pull request
# asks the `pdf` workflow for the article preview directly. No personal
# token is involved.

on:
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  select:
    name: select the frames
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .
      - name: Ask the catalog which frames each campaign covers
        run: python -m ccd_diffusion.tracks select --output selected
      - name: Decide which campaigns need extracting
        id: plan
        run: |
          python -m ccd_diffusion.tracks plan --frames selected --json selected/plan.json
          echo "matrix=$(jq -c '[.[].dataset]' selected/plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: selected
          if-no-files-found: error

  extract:
    name: extract ${{ matrix.dataset }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: frames
          path: selected
      - name: Export the campaign if its cutouts are current, else extract it
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          status=$(jq -r --arg d "$DATASET" '.[] | select(.dataset == $d) | .status' selected/plan.json)
          echo "$DATASET is $status"
          if [ "$status" = fresh ]; then
            python -m ccd_diffusion.tracks export --dataset "$DATASET" --output "extracted/$DATASET"
          else
            cp selected/iris_frames.csv ccd_diffusion/tracks/data/iris_frames.csv
            python -m ccd_diffusion.tracks extract --dataset "$DATASET" --output "extracted/$DATASET"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tracks-${{ matrix.dataset }}
          path: extracted/${{ matrix.dataset }}
          if-no-files-found: error

  merge:
    name: merge and fit
    needs: [select, extract]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: frames
          path: selected
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tracks-*
          path: extracted
      - name: Keep the existing cutouts of any campaign whose job failed
        run: |
          for d in $(jq -r '.[].dataset' selected/plan.json); do
            if [ ! -d "extracted/tracks-$d" ]; then
              echo "no result for $d; keeping what the package has"
              python -m ccd_diffusion.tracks export --dataset "$d" --output "extracted/tracks-$d" || true
            fi
          done
      - name: Join the campaigns
        run: python -m ccd_diffusion.tracks merge extracted/* --report report.md
      - name: Fit every track
        run: python -m ccd_diffusion.tracks fit
      - name: Open a pull request with the new data
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=ccd_diffusion/tracks/data
          git add -N "$data/iris_azimuth.csv" "$data/iris_depleted.csv" "$data/iris_campaigns.csv"
          if git diff --quiet -- "$data"; then
            echo "The data are unchanged; nothing to do."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/run-${GITHUB_RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git add "$data/iris_tracks.npz" "$data/iris_tracks.csv" \
                  "$data/iris_frames.csv" "$data/iris_azimuth.csv" \
                  "$data/iris_fits.csv" "$data/iris_depleted.csv" \
                  "$data/iris_campaigns.csv"
          git commit -q -m "Regenerate the track data from the IRIS archive

          Extracted and fit by the data workflow, run ${GITHUB_RUN_ID}."
          git push -q origin "$branch"
          {
            echo "The track cutouts, frame list, census, and fits, regenerated from the level-1 archive by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) of the data workflow."
            echo
            cat report.md
            echo
            echo "A campaign marked *refreshed* was extracted afresh, *reused* was current and taken from the package, *kept* is out of date but its job failed so its existing cutouts were left in place, and *missing* has no data at all. Review the article preview before merging; every figure, table, and number in the prose changes with the data."
          } > body.md
          gh pr create --base main --head "$branch" \
            --title "Regenerate the track data from the IRIS archive" \
            --body-file body.md
      - name: Approve the checks held on the new pull request
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # GitHub holds the pull-request runs of a pull request the Actions
          # token opened until someone approves them, and only those runs
          # count toward the rules on main; a copy of each check started by
          # `gh workflow run` passes but attaches to nothing
          held=""
          for attempt in $(seq 12); do
            held=$(gh run list --branch "$BRANCH" --event pull_request \
                     --json databaseId,conclusion \
                     --jq '.[] | select(.conclusion == "action_required") | .databaseId')
            [ "$(echo "$held" | grep -c .)" -ge 4 ] && break
            sleep 10
          done
          for id in $held; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"
          done
