name: docs

# Build the documentation, with its track browser and frame gallery, and
# publish it beside the article on GitHub Pages: under docs/ for main and
# under pr/N/docs/ as a preview of a pull request.
#
# The two slow parts depend only on the package's data and the code that
# reads it, so both are cached on a hash of those: the report notebook,
# executed once and then used with its outputs, and the browser's exported
# tracks and frames, which conf.py keeps when their stamp matches.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every publish pushes to the same branch, so serialize them with `pdf`.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install pandoc and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc graphviz
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[doc]
      - name: Restore the executed report notebook
        id: notebook
        uses: actions/cache@v4
        with:
          path: docs/reports/tracks.ipynb
          key: notebook-${{ hashFiles('docs/reports/tracks.ipynb', 'ccd_diffusion/tracks/**', 'ccd_diffusion/_ccd.py', 'pyproject.toml') }}
      - name: Execute the report notebook
        if: steps.notebook.outputs.cache-hit != 'true'
        # the executed copy, with its outputs, is what the cache keeps; the
        # build then uses it as it is (nbsphinx_execute = 'auto')
        run: python -m nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 docs/reports/tracks.ipynb
      - name: Restore the exported tracks and frames
        uses: actions/cache@v4
        with:
          path: docs/_static/browser
          key: browser-${{ hashFiles('ccd_diffusion/tracks/**') }}
      - name: Build the documentation
        # with MPLBACKEND set to agg the notebook's kernel would draw nothing
        # inline and the report would lose every figure without a warning
        run: sphinx-build -b html docs docs/_build/html

      - name: Determine where to publish
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "dir=docs" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=pr/${{ github.event.pull_request.number }}/docs" >> "$GITHUB_OUTPUT"
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the gh-pages branch
        env:
          DIR: ${{ steps.target.outputs.dir }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$remote" pages 2>/dev/null; then
            echo "cloned existing gh-pages"
          else
            echo "gh-pages does not exist yet; creating it"
            mkdir pages
            cd pages
            git init -q
            git checkout -q -b gh-pages
            git remote add origin "$remote"
            cd ..
          fi
          rm -rf "pages/${DIR}"
          mkdir -p "pages/${DIR}"
          cp -r docs/_build/html/. "pages/${DIR}/"
          touch "pages/.nojekyll"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The documentation is unchanged; nothing to publish."
          else
            git commit -q -m "Publish the documentation for ${SHA:0:7} to ${DIR}"
            git push -q origin gh-pages
          fi

      - name: Comment the preview link on the pull request
        if: steps.target.outputs.pr != ''
        env:
          PR: ${{ steps.target.outputs.pr }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/pr/${PR}/docs/"
          body="<!-- docs-preview -->
          **Documentation preview:** [index](${url}), [track browser](${url}browser.html), [frame gallery](${url}frames.html)

          Built from \`${SHA:0:7}\`. These links are updated on every push to this pull request."

          # Update the existing comment in place so pushes do not pile up comments.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- docs-preview -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
