name: Black

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:   # the data workflow asks for a run on the branch it pushes

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: psf/black@stable
        with:
          options: "--check --verbose --diff"
          src: "./ccd_diffusion"
